<!doctype html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Document</title>
  </head>
  <body
    style="
      background-color: #434a6b;
      color: #dee0eb;
      font-family: &quot;Bebas Neue&quot;, Arial, sans-serif;
      padding: 20px 0px;
    "
  >
    <h1 style="text-align: center">
      Tisztelt <span th:text="${studentName}"></span>!
    </h1>

    <p style="text-align: center">
      Az alábbiakban értesítjük, hogy oktatója,
      <span th:text="${instructorName}"></span> lemondta a
      <span th:text="${startTime}"></span>-kor kezdődő óráját.
    </p>

    <p style="text-align: center">
      Ha másik időpontot szeretne kérni azt az alábbi linken tudja megtenni.
    </p>

    <p style="text-align: center">
      Tisztelettel, <br />
      Félúton csapata.
    </p>
    <p style="font-size: 12px; text-align: center">
      (Ez egy automatikusan generált e-mail kérem ne válaszoljon rá)
    </p>
  </body>
</html>
