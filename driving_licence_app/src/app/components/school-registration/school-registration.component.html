<div class="container-fluid" style="height: 100vh !important; min-width: 100vw !important; background-color: rgba(0, 0, 0, 0.6);">
  <div class="row h-100">
    <div class="col-lg-12 d-flex justify-content-center align-items-center">
      <div class="container-fluid d-flex flex-column justify-content-between" id="secondContainer">
        <div class="row">
          <div class="col-lg-12">
            <div class="d-flex justify-content-end mt-3">
              <button class="closeButton" (click)="close.emit()">
                <span class="material-symbols-outlined">close</span>
              </button>
            </div>

            <h1 class="text-center text-white mainFont">Iskola létrehozása</h1>

          </div>
        </div>

        <div class="row">
          <div class="col-lg-12">
            <form [formGroup]="schoolForm" class="container-fluid">
              <div class="row">
                <div class="col-lg-12">
                  <input type="text" class="w-100 mt-3" placeholder="Iskola neve" formControlName="name">
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12">
                  <input type="text" class="w-100 mt-3" placeholder="E-mail cím" formControlName="email">
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12">
                  <input type="text" class="w-100 mt-3" placeholder="Telefonszám" formControlName="phone">
                </div>
              </div>

              <div class="row">
                <div class="col-lg-4">
                  <select class="w-100 mt-3" formControlName="country">
                    <option value="" selected disabled>Válaszd ki a vármegyét</option>
                    @for (country of varmegyek; track $index) {
                      <option [value]="country">{{country}}</option>
                    }
                  </select>
                </div>

                <div class="col-lg-8">
                  <input type="text" class="w-100 mt-3" placeholder="Város" formControlName="town"/>
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12">
                  <input type="text" class="w-100 mt-3" placeholder="Cím" formControlName="address">
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12">
                  <textarea type="text" class="w-100 mt-3 pt-3" style="height: 125px;" placeholder="Bemutatkozó szöveg" formControlName="promoText"></textarea>
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12">
                  <select class="w-100 mt-3" formControlName="ownerId">
                    <option value="" selected disabled>Válaszd ki a tulajt</option>
                    @for (user of userList; track $index) {
                      <option [value]="user.id" class="">{{user.name}}</option>
                    }
                  </select>
                </div>
              </div>

            </form>
          </div>
        </div>

        <div class="row w-100">
          <div class="col-lg-12 w-100 d-flex justify-content-center align-items-center">
            <button id="saveButton" class="text-white mb-4" (click)="createSchool()" [disabled]="schoolForm.invalid">Létrehozás</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
