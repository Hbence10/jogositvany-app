<div class="container-fluid" id="mainContainer">
  <div class="row h-100">
    <div class="col-lg-12 h-100 w-100 d-flex justify-content-center align-items-center">
      <div class="container-fluid d-flex flex-column justify-content-between" id="secondContainer">
        <div class="row">
          <div class="col-lg-12 d-flex justify-content-end">
            <button class="closeButton" (click)="close.emit()">
              <span class="material-symbols-outlined">close</span>
            </button>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12">
            <h1 class="text-center">Óra adatainak módósitása</h1>
          </div>
        </div>

        <div class="row h-100">
          <div class="col-lg-12">
            <form [formGroup]="drivingLessonForm" class="container-fluid">

              <div class="row">
                <div class="col-lg-6 mb-3">
                  <label for="pickUpPlace">Tanuló felvételi helye</label>
                  <input placeholder="Hol vetted fel a tanulót?" class="w-100" type="text" name="pickUpPlace" id="pickUpPlace" formControlName="pickUpPlace">
                </div>
                <div class="col-lg-6 mb-3">
                  <label for="dropOffPlace">Tanuló elhelyezési helye</label>
                  <input placeholder="Hol raktad le a tanulót?" class="w-100" type="text" name="dropOffPlace" id="dropOffPlace" formControlName="dropOffPlace">
                </div>
              </div>

              <div class="row">
                <div class="col-lg-6 mb-3">
                  <label for="startKm">Km óra állása kezdéskor:</label>
                  <input class="w-100" type="number" name="startKm" id="startKm" formControlName="startKm">
                </div>
                <div class="col-lg-6 mb-3">
                  <label for="endKm">Km óra állása végzéskor</label>
                  <input class="w-100" type="number" name="endKm" id="endKm" formControlName="endKm">
                </div>
              </div>

              <div class="row">
                <div class="col-lg-8 mb-3">
                  <label for="location">Hol vezetett a diák?</label>
                  <input class="w-100" type="text" name="location" id="location" formControlName="location">
                </div>
                <div class="col-lg-4 mb-3">
                  <label for="lessonHourNumber">Hány órát vezetett a diák</label>
                  <input class="w-100" type="number" name="lessonHourNumber" id="lessonHourNumber" formControlName="lessonHourNumber">
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12 mb-3 d-flex justify-content-between">
                  <div class="d-flex justify-content-start align-items-center w-25">
                    <input type="radio" name="isPaid" id="isPaid" (click)="isPaid = !isPaid" style="margin-right: 15px;">
                    <label for="isPaid">Ki van fizetve?</label>
                  </div>

                  <div class="d-flex flex-column justify-content-start align-items-center w-75">
                    <label for="paymentMethod" class="w-100">Fizetési mód</label>
                    <select [disabled]="!isPaid" class="w-100" name="paymentMethod" id="paymentMethod" formControlName="paymentMethod">
                      @for (paymentMethod of paymentMethods; track $index) {
                        <option [value]="paymentMethod.id">{{paymentMethod.name}}</option>
                      }
                    </select>
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12 mb-3 d-flex flex-column">
                  <label for="lessonStatus">Vezetési óra állapota</label>
                  <select name="lessonStatus" id="lessonStatus" formControlName="lessonStatus">
                    @for (status of statusList; track $index) {
                      <option [value]="status.id">{{status.name}}</option>
                    }
                  </select>
                </div>
              </div>
            </form>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-lg-12 d-flex justify-content-center">
            <button class="eventButton mx-2" (click)="cancelDrivingLesson()" [disabled]="drivingLesson().isEnd || drivingLesson().isCancelled">Lemondás</button>
            <button class="eventButton mx-2" (click)="sendSave()">Mentés</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
