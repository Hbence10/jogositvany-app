<div class="container-fluid" id="mainContainer">
  <div class="row h-100">
    <div class="col-lg-12 h-100 w-100 d-flex justify-content-center align-items-center">
      <div class="container-fluid" id="secondContainer">
        <div class="row">
          <div class="col-lg-12 mt-3 d-flex justify-content-end">
            <button class="closeButton" (click)="close.emit()">
              <span class="material-symbols-outlined">close</span>
            </button>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12 mb-3">
            <h1 class="text-center">Kérelem küldése</h1>
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-lg-12 ">
            <form class="container-fluid" [formGroup]="requestForm">
              <div class="row">
                <div class="col-lg-4 mb-3">
                  <label for="selectedDate">Dátum megadása</label>
                  <input class="w-100" [min]="minDate" [max]="maxDate" type="date" id="selectedDate" [valueAsDate]="selectedDate" #dateInput (change)="setDate(dateInput.value)">
                </div>

                <div class="col-lg-4 mb-3">
                  <label for="startTime">Mikor szeretnél kezdeni?</label>
                  <input class="w-100" type="time" formControlName="startTime" name="startTime" id="startTime">
                </div>
                <div class="col-lg-4 mb-3">
                  <label for="endTime">Mikor szeretnél végezni?</label>
                  <input class="w-100" type="time" formControlName="endTime" name="endTime" id="endTime">
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12 mb-3">
                  <label for="message">Egyéb üzenet az oktatónak:</label> <br>
                  <textarea style="height: 125px;" class="w-100" formControlName="message" name="message" id="message"></textarea>
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12 d-flex justify-content-center align-items-center">
                  <button [disabled]="requestForm.invalid" (click)="sendDrivingLessonRequest()" class="eventButton">Küldés</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
