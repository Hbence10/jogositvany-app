<div class="container-fluid my-4">
  <div class="row">
    <div class="col-lg-12 my-3 d-flex justify-content-start align-items-center">
      <img [src]="review().reviewAuthor?.studentUser?.pfpPath" alt="">
      <p class="my-0 mx-3">{{review().reviewAuthor?.studentUser?.firstName + " " + review().reviewAuthor?.studentUser?.lastName}}</p>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-12">
    </div>
  </div>

  <div class="row">
    <div class="col-lg-12">
      <p>{{review().text}}</p>
    </div>
  </div>
</div>
