<div class="container-fluid" id="mainContainer">

  <div class="row h-100">
    <div class="col-lg-12 h-100 d-flex justify-content-center align-items-center">
      <form [formGroup]="reviewForm" class="container-fluid d-flex flex-column justify-content-between py-3" id="secondContainer">

        <div class="row">
          <div class="col-lg-12">
            <h1 class="text-center">Nev</h1>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12">
            <div class="my-3 d-flex justify-content-between align-items-center">
            <div class="d-flex justify-content-start align-items-center">
              <img [src]="userService.loggedUser()?.pfpPath" alt="">
              <p class="my-0 mx-1">{{userService.loggedUser()?.firstName}} {{userService.loggedUser()?.lastName}}</p>
            </div>

            <div class="rate">
              <input type="radio" id="star5" name="rate" value="5" (click)="setRating(5)" />
              <label for="star5" title="text">5 stars</label>
              <input type="radio" id="star4" name="rate" value="4" (click)="setRating(4)" />
              <label for="star4" title="text">4 stars</label>
              <input type="radio" id="star3" name="rate" value="3" (click)="setRating(3)" />
              <label for="star3" title="text">3 stars</label>
              <input type="radio" id="star2" name="rate" value="2" (click)="setRating(2)" />
              <label for="star2" title="text">2 stars</label>
              <input type="radio" id="star1" name="rate" value="1" (click)="setRating(1)" />
              <label for="star1" title="text">1 star</label>
            </div>
          </div>

            <textarea formControlName="reviewText"></textarea>
            <input type="checkbox" name="anonym" id="anonym" (click)="isAnonymous = !isAnonymous">
            <label for="anonym">Kűldés név nélkül</label>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12 d-flex justify-content-center align-items-center">
            <button class="mx-2 eventButton" (click)="close.emit()">Mégsem</button>
            <button class="mx-2 eventButton" (click)="sendCreate()" [disabled]="reviewForm.invalid">Küldés</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
