<div class="container-fluid d-flex flex-column justify-content-between" style="min-height: 100vh;">
  <div class="row my-4">
    <div class="col-lg-12">
      <div>
        <button [class.selectedButton]="requestType == 'schoolJoin' || requestType == 'instructorJoin'" class="requestTypeButton mx-2 mb-3" (click)="requestType = ownerType == 'school' ? 'schoolJoin' : 'instructorJoin'; changeRequestList(0)">Csatlakozás</button>
        @if (ownerType == "instructor") {
          <button [class.selectedButton]="requestType == 'drivingLesson'" class="requestTypeButton mx-2" (click)="requestType = 'drivingLesson'; changeRequestList(0)">{{ownerType == 'instructor' ? "Óra kérelmek" : "Óra kérelmek"}}</button>
        }
      </div>
      <h1 class="text-lg-start text-center mainFont">
        @if (requestType == "schoolJoin" || requestType == "instructorJoin") {
          Csatlakozási kérelmek
        } @else {
          Óra kérelmek
        }
      </h1>
    </div>
  </div>

  <div class="row h-100">
    <div class="col-lg-12 h-100 d-flex flex-column justify-content-start">
      <div class="container-fluid h-100" style="max-height: 90vh; overflow-y: auto;">
        @for (requestRow of makeRows(); track $index) {
          <div class="row my-4">
            @for (request of requestRow; track $index) {
              <div class="col-lg-6">
                <app-request-card [requestDetail]="request" [requestType]="requestType" (answerRequest)="handleRequests($event)"/>
              </div>
            } @empty {
              <div class="col-lg-12">
                <h1 class="text-center">Jelenleg nincs kérelmed</h1>
              </div>
            }
          </div>
        }
      </div>
    </div>
  </div>

  <div class="row mb-2">
    <div class="col-lg-12 d-flex justify-content-between align-items-center">
        <div class="w-100 d-flex justify-content-center align-items-center">
          <button (click)="changePageWithArrow(-1)" class="arrowButton">
            <span class="material-symbols-outlined">keyboard_arrow_left</span>
          </button>
          <select class="mx-1" #pageSelect (change)="actualPage = +pageSelect.value+1;changeRequestList(+pageSelect.value)">
          @for (pageNumber of availablePages; track $index) {
            <option [selected]="pageNumber == actualPage" [value]="$index">{{$index+1}}</option>
          } @empty {
            <option value="0">1</option>
          }
        </select>
          <button (click)="changePageWithArrow(1)" class="arrowButton">
            <span class="material-symbols-outlined">keyboard_arrow_right</span>
          </button>
        </div>
    </div>
  </div>
</div>
