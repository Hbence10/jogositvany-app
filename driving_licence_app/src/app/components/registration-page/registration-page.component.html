<div id="mainContainer" class="container-fluid mainFont my-5">
  <div class="row h-100">
    <div class="col-lg-12 h-100 d-flex justify-content-center align-items-center">

      <div id="secondContainer" class="container-fluid py-4 d-flex flex-column justify-content-between">
        <div class="row">
          <div class="col-lg-12">
            <h1 class="text-center">Regisztráció</h1>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12">
            <form [formGroup]="registrationForm" class="container-fluid">
              <div class="row">
                <div class="col-lg-6 d-flex justify-content-center align-items-center">
                  <input class="inputs" type="text" placeholder="Keresztnév" formControlName="firstName">
                </div>
                <div class="col-lg-6 d-flex justify-content-center align-items-center">
                  <input class="inputs" type="text" placeholder="Vezetéknév" formControlName="lastName">
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12">
                  <input class="inputs" [class.error]="errorMsg == 'duplicateEmail'" type="email" placeholder="Email" formControlName="email" style="border: 2px solod red;">
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12">
                  <input class="inputs" [class.error]="errorMsg == 'duplicatePhone'" type="phone" placeholder="Telefonszám, pl. 06 70 123 4567" formControlName="phone">
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12">
                  <label for="birthDate"></label>
                  <input class="inputs" [class.error]="errorMsg == 'invalidDate'" [max]="now" type="date" placeholder="Születési dátum" formControlName="birthDate">
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12">
                  <label for="gender"></label>
                    <select class="inputs" formControlName="gender">
                      <option value="" disabled selected>Nem</option>
                      <option value="male">Férfi</option>
                      <option value="female">Nő</option>
                      <option value="other">Egyéb</option>
                    </select>
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12">
                  <label for="education"></label>
                    <select class="inputs" formControlName="education" placeholder="Végzettség" formControlName="education">
                      <option value="" selected disabled>Iskolai végzettség</option>
                      @for (education of educationList; track $index) {
                        <option [value]="education.getId">{{education.getName}}</option>
                      }
                    </select>
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12">
                  <label for="password"></label>
                  <input (click)="showPasswordReq = true" class="inputs" type="password" placeholder="Jelszó" formControlName="password">
                  @if (showPasswordReq) {
                    <ul>
                      <li>Min. 8, max. 16 karakter</li>
                      <li>Kisbetű, nagybetű</li>
                      <li>Szám</li>
                      <li>Speciális karakter</li>
                    </ul>
                  }
                  <div class="form-text text-white">
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-lg-12">
                  <label for="confirmPassword"></label>
                  <input class="inputs" type="password" placeholder="Jelszó megerősítése" formControlName="confirmPassword">
                </div>
              </div>

              <div class="row d-lg-flex">
                <div class="col-lg-12 d-flex justify-content-between align-items-center">
                  <p class="d-lg-block d-none">Van fiókja? <a routerLink="/login">Jelentkezzen be</a></p>
                </div>
              </div>

              <div class="row">
                <div class="col-lg-12">
                  <h6 class="text-center mt-3">Miként szeretnél regisztrálni?</h6>
                  <div class="d-flex justify-content-center align-items-center">
                    <div class="mx-2">
                      <label for="student" class="mx-1">Diákként</label>
                      <input [checked]="registrationForm.controls['registerAs'].value == 'student'" (click)="registrationForm.controls['registerAs'].setValue('student')" type="radio" name="registerAs" id="student">
                    </div>
                    <div class="mx-2">
                      <label for="instructor" class="mx-1">Oktatóként</label>
                      <input [checked]="registrationForm.controls['registerAs'].value == 'instructor'" (click)="registrationForm.controls['registerAs'].setValue('instructor')" type="radio" name="registerAs" id="instructor">
                    </div>
                    <div class="mx-2">
                      <label for="user" class="mx-1">Felhasználóként</label>
                      <input [checked]="registrationForm.controls['registerAs'].value == 'user'" (click)="registrationForm.controls['registerAs'].setValue('user')" type="radio" name="registerAs" id="user">
                    </div>
                  </div>
                </div>
              </div>

            </form>
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-lg-12 d-flex flex-column justify-content-center align-items-center">
            <button [disabled]="registrationForm.invalid" id="register-button" (click)="registration()">Regisztráció</button>
            <p class="d-lg-none d-block mt-2 mb-0">Van fiókja? <a routerLink="/login">Jelentkezzen be</a></p>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
