<div class="container-fluid d-flex flex-column justify-content-between align-items-center" style="min-height: 100vh;">
  <div class="row">
    <div class="col-lg-12">
      <h1 class="text-center mainFont mt-4">{{title}}</h1>
    </div>
  </div>

  <div class="w-100">
    @for (row of getCardRow(); track $index) {
  <div class="row mb-5">
    <div class="col-lg-12 d-flex flex-lg-row flex-column">
      @for (card of row; track $index) {
        <div class="container-fluid d-flex flex-column justify-content-between my-4 cardShadow" id="cardContainer">
          <div class="row">
            <div class="col-lg-12 d-flex flex-column align-items-center">
              <img [src]="card.imagePath" alt="" class="mt-4 mb-3 img-fluid">
              <h6 class="text-white">{{card.name}}</h6>
              <div class="col-lg-12 d-flex justify-content-center">
                <button class="iconButton mx-2 weekShadow">
                  <span class="material-icons text-white">mail</span>
                </button>
                <button (click)="navigateToUserPage(card)" class="iconButton mx-2 weekShadow">
                  <span class="material-symbols-outlined text-white">account_circle</span>
                </button>
              </div>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-lg-12 px-4">
               <button class="deleteButton w-100 text-white weekShadow" style="height: 40px;" (click)="handleDelete(card)">{{deleteText}}</button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
  }
  </div>

  <div class="row mb-2">
    <div class="col-lg-12 d-flex justify-content-between align-items-center">
        <div class="w-100 d-flex justify-content-center align-items-center">
          <button (click)="changePageWithArrow(-1)" class="arrowButton">
            <span class="material-symbols-outlined">keyboard_arrow_left</span>
          </button>
          <select class="mx-1" #pageSelect (change)="actualPage = +pageSelect.value;changePage(+pageSelect.value)">
          @for (pageNumber of availablePages; track $index) {
            <option [selected]="$index == actualPage" [value]="$index">{{$index+1}}</option>
          } @empty {
            <option value="0">1</option>
          }
        </select>
          <button (click)="changePageWithArrow(1)" class="arrowButton">
            <span class="material-symbols-outlined">keyboard_arrow_right</span>
          </button>
        </div>
    </div>
  </div>
</div>

@if (showDeleteConfirm){<div class="container-fluid" id="deleteContainer">
  <div class="row h-100">
    <div class="col-lg-12 h-100 d-flex justify-content-center align-items-center">
      <div class="container-fluid py-3 d-flex flex-column justify-content-between" id="confirmContainer">
        <div class="row">
          <div class="col-lg-12">
            <h2 class="text-center">{{deleteConfirmText}}</h2>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12 d-flex justify-content-center align-items-center">
            <button class="mx-2" (click)="deleteMember()">Igen</button>
            <button class="mx-2" (click)="showDeleteConfirm = false">Nem</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>}
